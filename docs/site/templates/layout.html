<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} · Intel AI Skills</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <meta name="theme-color" content="#0b1728">
  <meta property="og:title" content="{{TITLE}} · Intel AI Skills">
  <meta property="og:description" content="{{META_DESCRIPTION}}">
  <meta property="og:type" content="website">
  <link rel="icon" href="{{ASSET_PREFIX}}intel-ai-skills-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ASSET_PREFIX}}site.css">
</head>
<body>
  <a class="skip-link" href="#main-content">{{UI_SKIP}}</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="{{HOME_LINK}}" aria-label="{{UI_HOME_LABEL}}">
        <img class="brand-logo" src="{{ASSET_PREFIX}}intel-ai-skills-logo-light.svg" data-light-logo="{{ASSET_PREFIX}}intel-ai-skills-logo-light.svg" data-dark-logo="{{ASSET_PREFIX}}intel-ai-skills-logo-dark.svg" alt="Intel AI Skills" width="360" height="90">
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">{{UI_MENU}}</button>
      <nav id="site-navigation" class="site-navigation" aria-label="{{UI_PRIMARY_NAV}}">
        {{NAV}}
        <button class="theme-toggle" type="button" aria-label="{{UI_THEME}}" data-theme-toggle>◐ <span>{{UI_THEME}}</span></button>
      </nav>
      <div class="language-switcher" aria-label="{{UI_LANGUAGE_LABEL}}">{{LANG_SWITCHER}}</div>
    </header>
    <main id="main-content" class="{{BODY_CLASS}}">
      {{CONTENT}}
    </main>
    <footer class="site-footer">
      <div>
        <strong>Intel AI Skills</strong>
        <p>{{UI_FOOTER_TAGLINE}}</p>
      </div>
      <div class="footer-links">
        <a href="{{REPO_LINK}}">{{UI_REPO_LINK}}</a>
        <a href="{{GETTING_STARTED_LINK}}">{{UI_GET_STARTED_LINK}}</a>
      </div>
    </footer>
  </div>
  <script src="{{ASSET_PREFIX}}site.js" defer></script>
</body>
</html>
