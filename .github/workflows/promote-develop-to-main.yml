name: Promote develop to main

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-promotion-pr:
    name: open-promotion-pr
    runs-on: ubuntu-latest
    steps:
      - name: Open or reuse develop to main pull request
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = `${owner}:develop`;
            const base = 'main';

            const { data: openPullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head,
              base,
              per_page: 10,
            });

            if (openPullRequests.length > 0) {
              core.notice(`Promotion PR already exists: #${openPullRequests[0].number}`);
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.create({
              owner,
              repo,
              head: 'develop',
              base,
              title: 'chore: promote develop to main',
              body: [
                '## Automated promotion',
                '',
                'This pull request was opened automatically after changes entered `develop`.',
                '',
                '- Source: `develop`',
                '- Target: `main`',
                '- Merge only after the required checks and review pass.',
                '- This workflow does not merge the pull request automatically.',
              ].join('\\n'),
            });

            core.notice(`Created promotion PR: ${pullRequest.html_url}`);
